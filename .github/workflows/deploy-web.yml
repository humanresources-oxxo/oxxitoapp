# The app moved to Cloudflare (conoxxo.plaza-oaxaca.workers.dev, built there
# with npm run build:cloudflare; see PROJECT_README "Mudanza a Cloudflare").
# GitHub Pages (https://humanresources-oxxo.github.io/oxxitoapp/) now only
# serves mudanza/index.html, as every route (index, 404, admin/, instalar),
# which sends people to the same route at the new address. Pages goes away
# when the repository turns private.
name: Publicar aviso de mudanza

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar el aviso
        run: |
          mkdir -p dist/admin
          for f in index.html 404.html instalar.html admin/index.html; do cp mudanza/index.html "dist/$f"; done
          # Icons, so an installed (old) shortcut still looks like Conoxxo.
          cp public/icon-192.png public/icon-512.png public/apple-touch-icon.png public/manifest.json dist/
          echo "${GITHUB_SHA}" > dist/version.txt

      - name: Publicar en gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
          # Everything but .git and .nojekyll goes: only the notice stays.
          find site -mindepth 1 -maxdepth 1 ! -name .git ! -name .nojekyll -exec rm -rf {} +
          cp -r dist/. site/
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit -m "Aviso de mudanza (${GITHUB_SHA::7})"
          git push origin gh-pages
