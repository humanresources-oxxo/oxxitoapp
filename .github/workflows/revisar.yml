# Checks every pull request (and main) before it reaches production: Cloudflare
# builds and publishes main on its own, so a type error or a build that fails
# must show up here first. No secrets: it compiles and walks the main screens
# with fixed test data (scripts/e2e.mjs), never against production.
name: Revisar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: revisar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Sintaxis del Worker
        run: npm run check:worker

      - name: Cifrado de notificaciones (RFC 8291)
        run: npm run check:push

      - name: Compilar la app web (igual que Cloudflare)
        run: npm run build:cloudflare

      # Recorre las pantallas principales en un iPhone emulado con datos de
      # prueba (scripts/e2e.mjs): si algo se rompe, el cambio no se publica.
      - name: Navegador para las pruebas de pantallas
        run: npx playwright install --with-deps chromium

      - name: Pantallas (oficina, tienda, sin sesión, sin señal y celular chico)
        run: npm run e2e
