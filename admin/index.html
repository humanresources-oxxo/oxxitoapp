<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conoxxo - Panel Admin</title>
<style>
  :root { --red: #E4002B; --ink: #1c1c1c; --line: #e3e3e3; --bg: #FAF7F3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--red); color: #fff; padding: 16px 20px; font-weight: 800; font-size: 18px; }
  #gate { max-width: 360px; margin: 80px auto; padding: 24px; background: #fff; border-radius: 16px; border: 1px solid var(--line); }
  #gate input { width: 100%; padding: 12px; font-size: 15px; border-radius: 10px; border: 1px solid var(--line); margin: 10px 0; }
  button { background: var(--red); color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
  button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  button.danger { background: #b3261e; }
  button:disabled { opacity: .5; cursor: default; }
  #app { display: none; max-width: 900px; margin: 0 auto; padding: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tabs button { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .tabs button.active { background: var(--red); color: #fff; border-color: var(--red); }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .row input, .row textarea { flex: 1; min-width: 140px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 14px; }
  label.checkbox { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
  th { color: #777; font-size: 12px; text-transform: uppercase; }
  .msg { font-size: 13px; margin-top: 8px; }
  .msg.error { color: #b3261e; }
  .msg.ok { color: #1a7a3c; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .pill.temp { background: #FFE8E3; color: var(--red); }
  .pill.set { background: #E6F4EA; color: #1a7a3c; }
  .actions { display: flex; gap: 6px; }
</style>
</head>
<body>
<header>Conoxxo - Panel Admin</header>

<div id="gate">
  <p>Ingresa el passcode de administrador para continuar.</p>
  <input id="passcodeInput" type="password" placeholder="Passcode" />
  <button onclick="unlock()">Entrar</button>
  <div id="gateMsg" class="msg error"></div>
</div>

<div id="app">
  <div class="tabs">
    <button class="active" onclick="showTab('empleados')">Empleados</button>
    <button onclick="showTab('avisos')">Avisos</button>
    <button onclick="showTab('directorio')">Directorio</button>
  </div>

  <!-- EMPLEADOS -->
  <div id="tab-empleados" class="panel active">
    <div class="card">
      <h3>Agregar empleado</h3>
      <div class="row">
        <input id="empNumero" placeholder="Numero de empleado" />
        <input id="empNombre" placeholder="Nombre completo" />
      </div>
      <div class="row">
        <input id="empTienda" placeholder="Tienda (opcional)" />
        <input id="empPlaza" placeholder="Plaza (opcional)" />
        <input id="empAsesor" placeholder="Asesor (opcional)" />
      </div>
      <button onclick="addEmployee()">Agregar</button>
      <div id="empAddMsg" class="msg"></div>
    </div>

    <div class="card">
      <h3>Buscar empleados</h3>
      <div class="row">
        <input id="empSearch" placeholder="Buscar por numero o nombre..." oninput="listEmployees()" />
      </div>
      <table>
        <thead><tr><th>Numero</th><th>Nombre</th><th>Tienda</th><th>PIN</th><th></th></tr></thead>
        <tbody id="empTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- AVISOS -->
  <div id="tab-avisos" class="panel">
    <div class="card">
      <h3>Publicar aviso</h3>
      <div class="row">
        <input id="noticeTitle" placeholder="Titulo" />
      </div>
      <div class="row">
        <textarea id="noticeBody" placeholder="Mensaje" rows="3"></textarea>
      </div>
      <div class="row">
        <select id="noticeKind">
          <option value="policy">Politica</option>
          <option value="training">Capacitacion</option>
          <option value="schedule">Turnos</option>
          <option value="benefit">Beneficio</option>
        </select>
        <label class="checkbox"><input type="checkbox" id="noticePriority" /> Prioritario</label>
      </div>
      <button onclick="createNotice()">Publicar</button>
      <div id="noticeAddMsg" class="msg"></div>
    </div>

    <div class="card">
      <h3>Avisos publicados</h3>
      <table>
        <thead><tr><th>Titulo</th><th>Categoria</th><th>Fecha</th><th></th></tr></thead>
        <tbody id="noticeTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- DIRECTORIO -->
  <div id="tab-directorio" class="panel">
    <div class="card">
      <h3 id="contactFormTitle">Agregar contacto</h3>
      <input type="hidden" id="contactId" />
      <div class="row">
        <input id="contactName" placeholder="Nombre" />
        <input id="contactArea" placeholder="Area" />
      </div>
      <div class="row">
        <input id="contactRole" placeholder="Rol / descripcion" />
        <input id="contactPhone" placeholder="Telefono (+52...)" />
      </div>
      <div class="row">
        <input id="contactSchedule" placeholder="Horario" />
        <input id="contactTags" placeholder="Tags separados por coma" />
        <label class="checkbox"><input type="checkbox" id="contactUrgent" /> Prioritario</label>
      </div>
      <button onclick="saveContact()">Guardar</button>
      <button class="secondary" onclick="resetContactForm()">Cancelar edicion</button>
      <div id="contactMsg" class="msg"></div>
    </div>

    <div class="card">
      <h3>Contactos</h3>
      <table>
        <thead><tr><th>Nombre</th><th>Area</th><th>Telefono</th><th></th></tr></thead>
        <tbody id="contactTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://gceuazxrqdbfahtdieod.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_59I8XugqRxE-LUhMSqmiEQ_HNzD7CRK';
let passcode = '';

async function rpc(fn, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.message || 'error');
  return data;
}

async function unlock() {
  const value = document.getElementById('passcodeInput').value;
  const gateMsg = document.getElementById('gateMsg');
  gateMsg.textContent = '';
  try {
    const ok = await rpc('admin_check_passcode', { p_passcode: value });
    if (!ok) { gateMsg.textContent = 'Passcode incorrecto.'; return; }
    passcode = value;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    listEmployees();
    listNotices();
    listContacts();
  } catch (e) {
    gateMsg.textContent = 'No se pudo conectar. Intenta de nuevo.';
  }
}

function showTab(name) {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// --- Empleados ---
async function listEmployees() {
  const search = document.getElementById('empSearch').value.trim();
  const rows = await rpc('admin_list_employees', { p_passcode: passcode, p_search: search }).catch(() => []);
  const body = document.getElementById('empTableBody');
  body.innerHTML = rows.map((r) => `
    <tr>
      <td>${r.numero_empleado}</td>
      <td>${r.nombre}</td>
      <td>${r.tienda || '-'}</td>
      <td>${r.has_pin ? (r.pin_is_temporary ? '<span class="pill temp">Temporal</span>' : '<span class="pill set">Definitivo</span>') : '-'}</td>
      <td><button class="secondary" onclick="resetPin('${r.numero_empleado}')">Reiniciar PIN</button></td>
    </tr>
  `).join('') || '<tr><td colspan="5">Sin resultados.</td></tr>';
}

async function addEmployee() {
  const numero = document.getElementById('empNumero').value.trim();
  const nombre = document.getElementById('empNombre').value.trim();
  const tienda = document.getElementById('empTienda').value.trim();
  const plaza = document.getElementById('empPlaza').value.trim();
  const asesor = document.getElementById('empAsesor').value.trim();
  const msg = document.getElementById('empAddMsg');
  msg.className = 'msg';
  msg.textContent = '';
  if (!numero || !nombre) { msg.className = 'msg error'; msg.textContent = 'Numero y nombre son obligatorios.'; return; }
  try {
    await rpc('admin_add_employee', { p_passcode: passcode, p_numero: numero, p_nombre: nombre, p_tienda: tienda, p_plaza: plaza, p_asesor: asesor });
    msg.className = 'msg ok';
    msg.textContent = 'Agregado. Puede crear su PIN en su primer ingreso a la app.';
    document.getElementById('empNumero').value = '';
    document.getElementById('empNombre').value = '';
    document.getElementById('empTienda').value = '';
    document.getElementById('empPlaza').value = '';
    document.getElementById('empAsesor').value = '';
    listEmployees();
  } catch (e) {
    msg.className = 'msg error';
    msg.textContent = e.message.includes('employee_already_exists') ? 'Ese numero ya existe.' : 'No se pudo agregar.';
  }
}

async function resetPin(numero) {
  if (!confirm(`Quitar el PIN de ${numero}? Va a poder crear uno nuevo en su siguiente ingreso.`)) return;
  try {
    await rpc('admin_reset_pin', { p_passcode: passcode, p_numero: numero });
    alert(`Listo. ${numero} puede crear un PIN nuevo en su siguiente ingreso.`);
    listEmployees();
  } catch (e) {
    alert('No se pudo reiniciar el PIN.');
  }
}

// --- Avisos ---
async function listNotices() {
  const rows = await rpc('list_notices', {}).catch(() => []);
  const body = document.getElementById('noticeTableBody');
  body.innerHTML = rows.map((r) => `
    <tr>
      <td>${r.title}</td>
      <td>${r.kind}</td>
      <td>${new Date(r.published_at).toLocaleString('es-MX')}</td>
      <td><button class="danger" onclick="deleteNotice('${r.id}')">Borrar</button></td>
    </tr>
  `).join('') || '<tr><td colspan="4">Sin avisos.</td></tr>';
}

async function createNotice() {
  const title = document.getElementById('noticeTitle').value.trim();
  const body = document.getElementById('noticeBody').value.trim();
  const kind = document.getElementById('noticeKind').value;
  const priority = document.getElementById('noticePriority').checked;
  const msg = document.getElementById('noticeAddMsg');
  if (!title || !body) { msg.className = 'msg error'; msg.textContent = 'Titulo y mensaje son obligatorios.'; return; }
  try {
    await rpc('create_notice', { p_passcode: passcode, p_title: title, p_body: body, p_kind: kind, p_priority: priority });
    msg.className = 'msg ok';
    msg.textContent = 'Publicado.';
    document.getElementById('noticeTitle').value = '';
    document.getElementById('noticeBody').value = '';
    document.getElementById('noticePriority').checked = false;
    listNotices();
  } catch (e) {
    msg.className = 'msg error';
    msg.textContent = 'No se pudo publicar.';
  }
}

async function deleteNotice(id) {
  if (!confirm('Borrar este aviso?')) return;
  await rpc('admin_delete_notice', { p_passcode: passcode, p_id: id }).catch(() => {});
  listNotices();
}

// --- Directorio ---
async function listContacts() {
  const rows = await rpc('list_directory_contacts', {}).catch(() => []);
  const body = document.getElementById('contactTableBody');
  body.innerHTML = rows.map((r) => `
    <tr>
      <td>${r.name}</td>
      <td>${r.area}</td>
      <td>${r.phone}</td>
      <td class="actions">
        <button class="secondary" onclick='editContact(${JSON.stringify(r).replace(/'/g, "&apos;")})'>Editar</button>
        <button class="danger" onclick="deleteContact('${r.id}')">Borrar</button>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="4">Sin contactos.</td></tr>';
}

function editContact(r) {
  document.getElementById('contactFormTitle').textContent = 'Editar contacto';
  document.getElementById('contactId').value = r.id;
  document.getElementById('contactName').value = r.name;
  document.getElementById('contactArea').value = r.area;
  document.getElementById('contactRole').value = r.role;
  document.getElementById('contactPhone').value = r.phone;
  document.getElementById('contactSchedule').value = r.schedule;
  document.getElementById('contactTags').value = (r.tags || []).join(', ');
  document.getElementById('contactUrgent').checked = r.urgent;
}

function resetContactForm() {
  document.getElementById('contactFormTitle').textContent = 'Agregar contacto';
  ['contactId','contactName','contactArea','contactRole','contactPhone','contactSchedule','contactTags'].forEach((id) => document.getElementById(id).value = '');
  document.getElementById('contactUrgent').checked = false;
  document.getElementById('contactMsg').textContent = '';
}

async function saveContact() {
  const id = document.getElementById('contactId').value;
  const name = document.getElementById('contactName').value.trim();
  const area = document.getElementById('contactArea').value.trim();
  const role = document.getElementById('contactRole').value.trim();
  const phone = document.getElementById('contactPhone').value.trim();
  const schedule = document.getElementById('contactSchedule').value.trim();
  const tags = document.getElementById('contactTags').value.split(',').map((t) => t.trim()).filter(Boolean);
  const urgent = document.getElementById('contactUrgent').checked;
  const msg = document.getElementById('contactMsg');
  if (!name || !area || !role || !phone || !schedule) { msg.className = 'msg error'; msg.textContent = 'Todos los campos son obligatorios.'; return; }
  try {
    await rpc('admin_upsert_contact', { p_passcode: passcode, p_id: id || null, p_name: name, p_area: area, p_role: role, p_phone: phone, p_schedule: schedule, p_tags: tags, p_urgent: urgent });
    msg.className = 'msg ok';
    msg.textContent = 'Guardado.';
    resetContactForm();
    listContacts();
  } catch (e) {
    msg.className = 'msg error';
    msg.textContent = 'No se pudo guardar.';
  }
}

async function deleteContact(id) {
  if (!confirm('Borrar este contacto?')) return;
  await rpc('admin_delete_contact', { p_passcode: passcode, p_id: id }).catch(() => {});
  listContacts();
}
</script>
</body>
</html>
